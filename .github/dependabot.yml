version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
