name: API Security Scan

on:
  workflow_dispatch:
    inputs:
      openapi_target:
        description: HTTPS URL of the OpenAPI definition for an authorized non-production deployment
        required: true
        type: string
      authorized_target:
        description: I confirm that I am authorized to actively scan this non-production target
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: api-security-${{ inputs.openapi_target }}
  cancel-in-progress: false

jobs:
  zap:
    name: OWASP ZAP API scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scan authorization and target
        shell: bash
        env:
          AUTHORIZED_TARGET: ${{ inputs.authorized_target }}
          OPENAPI_TARGET: ${{ inputs.openapi_target }}
        run: |
          if [[ "${AUTHORIZED_TARGET}" != "true" ]]; then
            echo "Active scanning requires explicit authorization acknowledgement." >&2
            exit 1
          fi

          if [[ ! "${OPENAPI_TARGET}" =~ ^https:// ]]; then
            echo "The OpenAPI target must use HTTPS." >&2
            exit 1
          fi

      - name: Run OWASP ZAP API scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: ${{ inputs.openapi_target }}
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:stable@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-api-scan
          cmd_options: -a
