name: Security Scan

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy repository scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          validate-wrappers: true
          add-job-summary: on-failure

      - name: Build executable artifact
        run: ./gradlew clean bootJar -x test --no-daemon --stacktrace

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: "false"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-dirs: .git,.gradle,build/reports,build/test-results
          timeout: 15m

      - name: Upload Trivy results to code scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy report
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Enforce fixable high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          severity: HIGH,CRITICAL
          skip-dirs: .git,.gradle,build/reports,build/test-results
          skip-setup-trivy: "true"
          cache: "false"
          timeout: 15m
